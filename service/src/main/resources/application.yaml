--- # Common
spring:
  application:
    name: portal
  main:
    banner-mode: off
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  cloud:
    compatibility-verifier:
      enabled: false
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:openai}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:none}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
    openai:
      api-key: ${OPENROUTER_API_KEY:dummy}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}

server:
  port: 8081
  error:
    whitelabel.enabled: false
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 48h

app:
  frontend-uri: ${FRONTEND_URL}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  s3:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    endpoint: ${S3_ENDPOINT}
    bucket: ${S3_BUCKET}
    bucket-service: ${S3_BUCKET_SERVICE}
    presign-duration: PT12H
  authentik:
    base-url: ${OAUTH2_SERVER}
    api-key: ${AUTHENTIK_API_KEY}
  wordpress:
    instances:
  outline:
    base-url: ${OUTLINE_BASE_URL}
    api-key: ${OUTLINE_API_KEY} # outline -> preferences -> api&apps -> new api key with scopes: "groups.* users.*"
  helpdesk:
    api-key: ${HELPDESK_API_KEY}
    api-base-url: ${HELPDESK_API_BASE_URL}
    ticket-base-url: ${HELPDESK_TICKET_BASE_URL}
  clanovi:
    api-key: ${CLANOVI_API_KEY:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    applications-chat-id: ${TELEGRAM_APPLICATIONS_CHAT_ID:}
    acceptance-chat-id: ${TELEGRAM_ACCEPTANCE_CHAT_ID:}
  schedulers:
    email-outbox: ${SCHEDULER_EMAIL_OUTBOX_CRON:*/15 * * * * *} # every 15 seconds
    user-sync: ${SCHEDULER_USER_SYNC_CRON:0 0 */1 * * *} # every hour
    expired-applications: ${SCHEDULER_EXPIRED_APPLICATIONS_CRON:0 0 6 */1 * *} # every day at 6 a.m.
    contract-expiration: ${SCHEDULER_CONTRACT_EXPIRATION_CRON:0 0 7 */1 * *} # every day at 7 a.m.
    depersonalization-warning: ${SCHEDULER_DEPERSONALIZATION_WARNING_CRON:0 0 8 */1 * *} # every day at 8 a.m.
    depersonalization: ${SCHEDULER_DEPERSONALIZATION_CRON:0 0 9 */1 * *} # every day at 9 a.m.
    overdue-reports: ${SCHEDULER_OVERDUE_REPORTS_CRON:0 0 10 */1 * *} # every day at 10 a.m.

--- # Data
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?ApplicationName=${spring.application.name}&targetServerType=master
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      schema: public
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    default-schema: ${spring.datasource.hikari.schema}
    change-log: classpath:/liquibase/changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASS}
      database: ${REDIS_DATABASE}

--- # Security
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_SERVER}/application/o/${spring.application.name}/
      client:
        provider:
          authentik:
            issuer-uri: ${OAUTH2_SERVER}/application/o/${spring.application.name}/
            authorization-uri: ${OAUTH2_SERVER}/application/o/authorize/
            token-uri: ${OAUTH2_SERVER}/application/o/token/
            user-info-uri: ${OAUTH2_SERVER}/application/o/userinfo/
            jwk-set-uri: ${OAUTH2_SERVER}/application/o/${spring.application.name}/jwks/
            user-name-attribute: nickname
        registration:
          authentik:
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            client-name: Authentik SSO
            provider: authentik
            redirect-uri: ${FRONTEND_URL}/api/oauth2/code
            authorization-grant-type: authorization_code
            scope: openid, email, profile

# Cloudflare Turnstile Captcha
ds:
  cf:
    turnstile:
      sitekey: ${TURNSTILE_SITE_KEY}
      secret: ${TURNSTILE_SECRET}

--- # Mail
spring:
  mail:
    host: ${SMTP_SERVER}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
    default-encoding: UTF-8
management:
  health:
    mail:
      enabled: false

--- # Errors
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

--- # Logging
logging:
  level:
    org:
      springframework:
        web.filter.CommonsRequestLoggingFilter: DEBUG
        data.repository.config: WARN
