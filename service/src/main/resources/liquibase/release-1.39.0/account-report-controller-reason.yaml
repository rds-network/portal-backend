databaseChangeLog:
  - changeSet:
      id: 1.39.0-add-report-controller-reason-to-account
      author: portal
      changes:
        - addColumn:
            tableName: account
            columns:
              - column:
                  name: report_controller_reason
                  type: VARCHAR(1000)
                  constraints:
                    nullable: true
              - column:
                  name: report_controller_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
