databaseChangeLog:
  - changeSet:
      id: 1.46.0-dissolution-inbox-participants-cleanup
      author: portal
      comment: >
        Remove leaked DISSOLUTION_REQUEST / DISSOLUTION_DECISION inbox participants from
        pre-approver-only notify; keep only requester + leave/dissolution approver (legkov777)
        on requests, and recipient + created_by on decisions.
      changes:
        - sql:
            dbms: postgresql
            sql: |
              -- Drop everyone who should not see dissolution-request threads
              DELETE FROM inbox_participant p
              USING inbox_thread t
              WHERE p.thread_id = t.id
                AND t.kind = 'DISSOLUTION_REQUEST'
                AND LOWER(p.username) <> LOWER('legkov777')
                AND (t.created_by IS NULL OR LOWER(p.username) <> LOWER(t.created_by));

              -- Canonical recipient is the leave/dissolution approver
              UPDATE inbox_thread
              SET recipient = 'legkov777'
              WHERE kind = 'DISSOLUTION_REQUEST';

              -- Ensure approver is a participant (ack still required for recipient)
              INSERT INTO inbox_participant (id, version, thread_id, username, unread, ack_required, received_at)
              SELECT gen_random_uuid(), NOW(), t.id, a.username, true, true, NULL
              FROM inbox_thread t
              JOIN account a ON LOWER(a.username) = LOWER('legkov777')
              WHERE t.kind = 'DISSOLUTION_REQUEST'
                AND NOT EXISTS (
                  SELECT 1
                  FROM inbox_participant p
                  WHERE p.thread_id = t.id
                    AND LOWER(p.username) = LOWER(a.username)
                );

              -- Dissolution decisions: only volunteer (recipient) and approver (created_by)
              DELETE FROM inbox_participant p
              USING inbox_thread t
              WHERE p.thread_id = t.id
                AND t.kind = 'DISSOLUTION_DECISION'
                AND (t.recipient IS NULL OR LOWER(p.username) <> LOWER(t.recipient))
                AND (t.created_by IS NULL OR LOWER(p.username) <> LOWER(t.created_by));
