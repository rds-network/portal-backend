databaseChangeLog:
  - changeSet:
      id: 1.40.0-add-mup-letter-flags-to-account
      author: portal
      changes:
        - addColumn:
            tableName: account
            columns:
              - column:
                  name: mup_letter_sent_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: mup_letter_reason
                  type: VARCHAR(64)
                  constraints:
                    nullable: true
