databaseChangeLog:
  - changeSet:
      id: 1.40.0-account-status-request-create-table
      author: portal
      changes:
        - createTable:
            tableName: account_status_request
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_account_status_request
                  name: id
                  type: UUID
              - column:
                  constraints:
                    nullable: false
                  name: version
                  type: DATETIME
              - column:
                  constraints:
                    nullable: false
                    referencedTableName: account
                    referencedColumnNames: id
                    foreignKeyName: fk_account_status_request_target
                  name: target_account_id
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: requested_active
                  type: BOOLEAN
              - column:
                  constraints:
                    nullable: false
                  name: status
                  type: VARCHAR(32)
              - column:
                  name: reason
                  type: TEXT
              - column:
                  constraints:
                    nullable: false
                    referencedTableName: account
                    referencedColumnNames: username
                    foreignKeyName: fk_account_status_request_created_by
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: created_at
                  type: DATETIME
              - column:
                  name: decided_by
                  type: VARCHAR(255)
              - column:
                  name: decided_at
                  type: DATETIME
              - column:
                  name: decision_reason
                  type: TEXT
        - addForeignKeyConstraint:
            baseTableName: account_status_request
            baseColumnNames: decided_by
            referencedTableName: account
            referencedColumnNames: username
            constraintName: fk_account_status_request_decided_by
        - createIndex:
            tableName: account_status_request
            indexName: idx_account_status_request_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: account_status_request
            indexName: idx_account_status_request_target
            columns:
              - column:
                  name: target_account_id
        - sql:
            sql: >
              CREATE UNIQUE INDEX idx_account_status_request_pending_unique
              ON account_status_request (target_account_id, requested_active)
              WHERE status = 'PENDING';
