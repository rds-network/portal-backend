name: Build & Deploy

on:
  push:
    branches: [ main ]

env:
  PERIOD: 10 # seconds
  ATTEMPTS: 60 # PERIOD * ATTEMPTS = 600 s = 10 min

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ruskadijaspora/docker:portal-backend
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  Deploy:
    needs:
      - Build
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get install jq
      - name: Start deploy
        id: start_deploy
        run: |
          response=$(curl -s --request POST '${{ vars.COOLIFY_API_URL }}/api/v1/deploy?uuid=${{ vars.COOLIFY_SERVICE_ID }}&force=false' --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}')
          deployment_uuid=$(echo $response | jq -r '.deployments[0].deployment_uuid')
          if [[ $deployment_uuid == "null" ]]; then
            printf "Failed to start deployment: \n$response"
            exit 1
          fi
          echo "deployment_uuid=$deployment_uuid" >> $GITHUB_OUTPUT
      - name: Checking deploy status
        run: |
          deployment_uuid=${{ steps.start_deploy.outputs.deployment_uuid }}
          deployment_url=""
          
          period=${{ env.PERIOD }}
          attempts=${{ env.ATTEMPTS }}
          
          count=0
          while [ "$status" != "finished" ] && [ "$count" -lt "$attempts" ]
          do
            sleep $period
            count=$(( $count + 1 ))
            response=$(curl -s --request GET "${{ vars.COOLIFY_API_URL }}/api/v1/deployments/$deployment_uuid" --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}')
            status=$(echo $response | jq -r '.status')
            deployment_url=$(echo $response | jq -r '.deployment_url')
          
            printf `expr $count \* $period`
            printf "s, status: $status\n"
          
            if [[ $status == "null" ]]; then
              printf "Deployment failed: \n$response"
              exit 1
            fi
          
            if [[ $status == "finished" ]]; then
              printf "Deployment finished successfully. \nMore info at ${{ vars.COOLIFY_API_URL }}$deployment_url"
              exit 0
            fi
          
            if [[ $status != "in_progress" ]]; then
              printf "Deployment failed. \nMore info at ${{ vars.COOLIFY_API_URL }}$deployment_url"
              exit 1
            fi
          done
          
          printf "Deployment didn't completed after 10 minutes. \nMore info at ${{ vars.COOLIFY_API_URL }}$deployment_url"
          exit 1
