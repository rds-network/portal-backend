name: Publish API

on:
  push:
    paths:
      - api/**
      - .github/**

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Generate API
        if: ${{ github.ref_name == 'main' }}
        run: ./gradlew clean axios-client:build -x test
      - name: Generate snapshot API
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo ${GITHUB_SHA} | cut -c1-7
          ./gradlew clean axios-client:build -x test -Psnapshot=$(echo ${GITHUB_SHA} | cut -c1-7)
      - name: Publish NPM package
        working-directory: ./api/axios-client/build
        run: |
          echo //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }} > .npmrc
          npm install
          # npm 11+ refuses to publish prerelease (snapshot) versions without an explicit dist-tag.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            npm publish
          else
            npm publish --tag snapshot
          fi
