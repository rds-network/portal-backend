openapi: 3.0.1
info:
  title: volunteer-portal-api
  version: 1.39.0
  contact:
    email: dev@russian.rs
    url: https://russian.rs

servers:
  - url: https://portal-test.russian.rs/api
    description: Test Environment
  - url: https://portal.russian.rs/api
    description: Prod Environment

paths:
  /user/account:
    get:
      operationId: getCurrentAccount
      tags:
        - user
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createUser
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/account/{id}/program/{code}:
    patch:
      operationId: setProgram
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/account/{id}/project/{code}:
    patch:
      operationId: setProject
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/account/{id}/deactivate:
    post:
      operationId: deactivateAccount
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/account/{id}/activate:
    post:
      operationId: activateAccount
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/account/{id}/contracts:
    post:
      operationId: updateContracts
      description: Обновить список договоров волонтера
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            nullable: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ContractDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/account/{id}/residence-permits:
    put:
      operationId: updateResidencePermits
      description: Обновить список ВНЖ волонтера
      tags:
        - user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ResidencePermitDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/account/{id}/residence-permits/{permitId}:
    delete:
      operationId: deleteResidencePermit
      description: Удалить ВНЖ волонтера (только для администраторов)
      tags: [ user ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: permitId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/info/{login}:
    get:
      operationId: getInfo
      tags:
        - user
      parameters:
        - name: login
          in: path
          description: User login
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      operationId: updateInfo
      tags:
        - user
      parameters:
        - name: login
          in: path
          description: User login
          required: true
          schema:
            type: string
            minLength: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInfoUpdateRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
        "500":
          $ref: "#/components/responses/ServerError"

  /user/search:
    post:
      operationId: searchUsers
      tags:
        - user
      parameters:
        - name: searchQuery
          in: query
          required: true
          schema:
            type: string
        - name: pageRequest
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PageRequest"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSearchFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageResponse"
  /user/logout:
    post:
      operationId: logout
      tags:
        - user
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
          description: Logout from all devices
          required: false
      responses:
        "200":
          description: Successfully logged out
        "500":
          $ref: "#/components/responses/ServerError"
  /user/avatar:
    post:
      operationId: setAvatar
      tags:
        - user
      parameters:
        - name: avatarId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
  /user/resolve:
    post:
      operationId: resolveUsers
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              default: [ ]
              items:
                type: string
                maxLength: 100
                minLength: 1
                nullable: false
                description: username
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                default: [ ]
                items:
                  $ref: "#/components/schemas/UserInfoDto"

  /files/upload:
    post:
      operationId: uploadFile
      tags:
        - files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  nullable: false
      responses:
        "200":
          description: Successfully uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfoDto"
  /files/{id}:
    get:
      operationId: getFileInfo
      tags:
        - files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            nullable: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfoDto"
        "400":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /report:
    post:
      operationId: createReport
      tags:
        - report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDto"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      operationId: updateReport
      tags:
        - report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDto"
  /report/{id}:
    get:
      operationId: getReport
      tags:
        - report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDto"
        "404":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteReport
      tags:
        - report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
        "404":
          $ref: "#/components/responses/ServerError"
  /report/{id}/note:
    post:
      operationId: addNote
      tags:
        - report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDto"
  /report/{id}/status:
    post:
      operationId: changeStatus
      tags:
        - report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeReportStatusRequest"
      responses:
        "200":
          description: Success
  /reports:
    post:
      operationId: getReports
      tags:
        - report
      parameters:
        - name: pageRequest
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PageRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPageResponse"
  /reports/heat-map:
    get:
      operationId: getCurrentUserHeatMapDeprecated
      description: (deprecated) Тепловая карта отчетов текущего пользователя
      tags:
        - report-heat-map
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerHeatMapItem"
    post:
      operationId: getVolunteerHeatMap
      description: Тепловая карта отчетов для администраторов
      tags:
        - report-heat-map
      parameters:
        - name: searchQuery
          in: query
          required: true
          schema:
            type: string
        - name: pageRequest
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PageRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportsHeatMapFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsHeatMapPageResponse"
  /reports/heat-map/currentUser:
    get:
      operationId: getCurrentUserHeatMap
      description: Тепловая карта отчетов текущего пользователя
      tags:
        - report-heat-map
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: Тепловые карты пользователя за текущий и прошлый год
                additionalProperties:
                  $ref: "#/components/schemas/VolunteerHeatMapItem"
  /application/create:
    post:
      operationId: createApplication
      tags:
        - application
      parameters:
        - name: captchaToken
          in: query
          required: true
          schema:
            type: string
            nullable: false
            description: Turnstile Captcha Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatusDto"
  /application/{id}:
    get:
      operationId: getApplication
      tags:
        - application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
  /application/assignees:
    get:
      operationId: getApplicationAssignees
      description: Active employees who can handle applications.
      tags:
        - application
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfoDto"
  /application/{id}/assignee:
    put:
      operationId: assignApplication
      description: Explicitly assign an active application employee, or clear the assignment.
      tags:
        - application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationAssignmentRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
  /application/{id}/note:
    post:
      operationId: addNoteToApplication
      description: Добавление заметки по заявке
      tags:
        - application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDto"
  /application/update:
    put:
      operationId: updateApplication
      tags:
        - application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDto"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
  /applications:
    post:
      operationId: getApplications
      tags:
        - application
      parameters:
        - name: pageRequest
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PageRequest"
        - name: searchQuery
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          "*/*":
            schema:
              $ref: "#/components/schemas/ApplicationsFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPageResponse"
  /application/status/{id}:
    get:
      operationId: getApplicationStatus
      tags:
        - application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            nullable: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatusDto"
  /application/searchByEmail:
    get:
      operationId: searchApplicationByEmail
      tags:
        - application
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            nullable: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatusDto"

  /announcements:
    get:
      operationId: getAnnouncements
      tags:
        - announcements
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnouncementDto"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createAnnouncement
      tags:
        - announcements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreateRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementDto"
        "500":
          $ref: "#/components/responses/ServerError"

  /announcements/unread-count:
    get:
      operationId: getUnreadAnnouncementsCount
      tags:
        - announcements
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadAnnouncementsCountDto"
        "500":
          $ref: "#/components/responses/ServerError"

  /announcements/{id}/read:
    post:
      operationId: markAnnouncementRead
      tags:
        - announcements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
        "500":
          $ref: "#/components/responses/ServerError"

  /mail/send:
    post:
      operationId: sendMail
      tags:
        - mail
      parameters:
        - name: subject
          in: query
          required: true
          schema:
            type: string
            minLength: 3
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: attachments
          in: query
          style: form
          required: false
          schema:
            type: array
            items:
              type: string
              nullable: false
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Success

  /note/{id}:
    delete:
      operationId: deleteNote
      tags:
        - note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success

  /programs:
    get:
      operationId: getPrograms
      tags:
        - programs
      summary: Получить список всех доступных программ
      responses:
        "200":
          description: Список программ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramDto"
        "500":
          $ref: "#/components/responses/ServerError"

  /projects:
    get:
      operationId: getProjects
      tags:
        - projects
      summary: Получить список всех доступных проектов
      responses:
        "200":
          description: Список проектов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectDto"
        "500":
          $ref: "#/components/responses/ServerError"

  /official-group:
    get:
      operationId: getOfficialGroup
      tags:
        - officialGroup
      summary: Получить список всех доступных официальных групп
      responses:
        "200":
          description: Список официальных групп
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficialGroupDto"
        "500":
          $ref: "#/components/responses/ServerError"

  /cities:
    get:
      operationId: getCities
      tags:
        - cities
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityDto"
        "500":
          $ref: "#/components/responses/ServerError"
  /cities/{code}:
    get:
      operationId: findCityByCode
      tags:
        - cities
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: City code (e.g., "belgrade", "novi-sad")
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityDto"
        "404":
          description: City not found
        "500":
          $ref: "#/components/responses/ServerError"
  /cities/search:
    get:
      operationId: findCityByName
      tags:
        - cities
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: City name to search (supports both Latin and Cyrillic, e.g., "Beograd", "Белград")
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityDto"
        "500":
          $ref: "#/components/responses/ServerError"

  /statistics/{year}:
    get:
      operationId: getStatistics
      tags:
        - statistics
      parameters:
        - name: year
          in: path
          description: Год для получения статистики для мин. труд
          required: true
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
      responses:
        "200":
          description: Статистика для мин. труд по группам за год
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /statistics/{year}/cities:
    get:
      operationId: getCityStatistics
      description: Количество волонтёров по населённым пунктам за выбранный год
      tags:
        - statistics
      parameters:
        - name: year
          in: path
          description: Год, за который считаются волонтёры
          required: true
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
      responses:
        "200":
          description: Разбивка волонтёров по населённым пунктам за год
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityStatistics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /ticket:
    post:
      operationId: createTicket
      description: Создание тикета (обращения)
      tags:
        - tickets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreateRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCreateResponse"
  /ticket/groups:
    get:
      operationId: getTicketGroups
      description: Получить доступные группы поддержки
      tags:
        - tickets
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                default: [ ]
                items:
                  type: string
                  default: Название группы поддержки для создания тикета

  /csrf:
    get:
      operationId: getCsrfToken
      summary: Get CSRF token
      description: Triggers CSRF token cookie to be set for SPA frontend
      tags:
        - security
      responses:
        "200":
          description: CSRF token cookie set successfully

  /translate/serbian:
    post:
      operationId: translateToSerbian
      tags:
        - translate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextTranslationRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextTranslationResponse"

